server {
    server_name mobilitydatahub.com www.mobilitydatahub.com;

    root /var/www/mobilitydatahub.com;
    index index.html;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mobilitydatahub.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mobilitydatahub.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.mobilitydatahub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = mobilitydatahub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name mobilitydatahub.com www.mobilitydatahub.com;
    return 404; # managed by Certbot




}
